syntax = "proto3";

import "base.proto";

enum CameraId {
    CAMERA_ID_UNKNOWN = 0;
    CAMERA_ID_TELE = 1;
    CAMERA_ID_WIDE = 2;
    CAMERA_ID_GUIDE = 3;
}

enum CfaType {
    CFA_TYPE_UNKNOWN = 0;
    CFA_TYPE_NONE = 1;
    CFA_TYPE_BAYER = 2;
}

enum RawFormat {
    RAW_FORMAT_UNKNOWN = 0;
    RAW_FORMAT_RAW8 = 1;
    RAW_FORMAT_RAW10 = 2;
    RAW_FORMAT_RAW12 = 3;
}

enum BayerPattern {
    BAYER_PATTERN_UNKNOWN = 0;
    BAYER_PATTERN_NONE = 1;
    BAYER_PATTERN_BGGR = 2;
    BAYER_PATTERN_RGGB = 3;
    BAYER_PATTERN_GBRG = 4;
    BAYER_PATTERN_GRBG = 5;
}

enum RawStorage {
    RAW_STORAGE_UNKNOWN = 0;
    RAW_STORAGE_RAW8 = 1;
    RAW_STORAGE_PACKED10 = 2;
    RAW_STORAGE_PACKED12 = 3;
    RAW_STORAGE_UNPACKED16 = 4;
}

enum ByteOrder {
    BYTE_ORDER_UNKNOWN = 0;
    BYTE_ORDER_LITTLE_ENDIAN = 1;
    BYTE_ORDER_BIG_ENDIAN = 2;
}

enum CameraFocusType {
    FOCUS_TYPE_UNKNOWN = 0;
    FOCUS_TYPE_STEPPER = 1;
    FOCUS_TYPE_VCM = 2;
}

enum FocusId {
    FOCUS_ID_UNKNOWN = 0;
    FOCUS_ID_TELE = 1;
    FOCUS_ID_GUIDE = 2;
    FOCUS_ID_WIDE = 3;
}

message ReqOpenCamera {
    bool binning = 1;
    int32 rtsp_encode_type = 2;
}

message ReqCloseCamera {
}

message ReqPhoto {
}

message ReqBurstPhoto {
    int32 count = 1;
}

message ReqStopBurstPhoto {
}

message ReqStartRecord {
    int32 encode_type = 1;
}

message ReqStopRecord {
}

message ReqSetExpMode {
    int32 mode = 1;
}

message ReqGetExpMode {
}

message ReqSetExp {
    int32 index = 1;
}

message ReqGetExp {
}

message ReqSetGainMode {
    int32 mode = 1;
}

message ReqGetGainMode {
}

message ReqSetGain {
    int32 index = 1;
}

message ReqGetGain {
}

message ReqSetBrightness {
    int32 value = 1;
}

message ReqGetBrightness {
}

message ReqSetContrast {
    int32 value = 1;
}

message ReqGetContrast {
}

message ReqSetHue {
    int32 value = 1;
}

message ReqGetHue {
}

message ReqSetSaturation {
    int32 value = 1;
}

message ReqGetSaturation {
}

message ReqSetSharpness {
    int32 value = 1;
}

message ReqGetSharpness {
}

message ReqSetWBMode {
    int32 mode = 1;
}

message ReqGetWBMode {
}

message ReqSetWBSence {
    int32 value = 1;
}

message ReqGetWBSence {
}

message ReqSetWBCT {
    int32 index = 1;
}

message ReqGetWBCT {
}

message ReqSetIrCut {
    int32 value = 1;
}

message ReqSetNdFilter {
    bool value = 1;
}

message ReqGetIrcut {
}

message ReqStartTimeLapse {
}

message ReqStopTimeLapse {
}

message ReqSetAllParams {
    int32 exp_mode = 1;
    int32 exp_index = 2;
    int32 gain_mode = 3;
    int32 gain_index = 4;
    int32 ircut_value = 5;
    int32 wb_mode = 6;
    int32 wb_index_type = 7;
    int32 wb_index = 8;
    int32 brightness = 9;
    int32 contrast = 10;
    int32 hue = 11;
    int32 saturation = 12;
    int32 sharpness = 13;
    int32 jpg_quality = 14;
}

message ReqGetAllParams {
}

message ResGetAllParams {
    repeated CommonParam all_params = 1;
    int32 code = 2;
}

message ReqSetFeatureParams {
    CommonParam param = 1;
}

message ReqGetAllFeatureParams {
}

message ResGetAllFeatureParams {
    repeated CommonParam all_feature_params = 1;
    int32 code = 2;
}

message ReqGetSystemWorkingState {
}

message ReqSetJpgQuality {
    int32 quality = 1;
}

message ReqGetJpgQuality {
}

message ReqPhotoRaw {
}

message ReqSetRtspBitRateType {
    int32 bitrate_type = 1;
}

message ReqDisableAllIspProcessing {
}

message ReqEnableAllIspProcessing {
}

message IspModuleState {
    int32 module_id = 1;
    bool state = 2;
}

message ReqSetIspModuleState {
    repeated IspModuleState module_states = 1;
}

message ReqGetIspModuleState {
    repeated int32 module_ids = 1;
}

message ReqSwitchResolution {
    int32 resolution_index = 1;
}

message ReqSwitchFrameRate {
    int32 fps_index = 1;
}

message ReqSwitchCropRatio {
    int32 crop_ratio = 1;
}

message ReqSetPreviewQuality {
    uint32 level = 1;
    uint32 quality = 2;
}

message ReqGetCameraAndFocusInfo {
}

message SensorInfo {
    CameraId camera_id = 1;
    string cmos_model = 2;
    int32 image_width = 3;
    int32 image_height = 4;
    CfaType cfa_type = 5;
    RawFormat raw_format = 6;
    BayerPattern bayer_pattern = 7;
    RawStorage raw_storage = 8;
    int32 row_stride_bytes = 9;
    ByteOrder byte_order = 10;
}

message FocusInfo {
    FocusId focus_id = 1;
    CameraFocusType focus_type = 2;
    double total_travel_um = 3;
    double um_per_step = 4;
    int32 min_code = 5;
    int32 max_code = 6;
}

message ResGetCameraAndFocusInfo {
    int32 code = 1;
    string schema_version = 2;
    repeated SensorInfo sensor_infos = 3;
    repeated FocusInfo focus_infos = 4;
}
